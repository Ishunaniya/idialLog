name: dialLog CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run complete host regression
        run: make check
      - name: Run large-log performance invariants
        run: make perf

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run with ASan and UBSan
        run: >-
          make check
          HOST_CXXFLAGS='-std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer'
          HOST_LDFLAGS='-fsanitize=address,undefined'

  windows-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build x64 and x86 consecutively
        run: make windows-all
      - name: Verify PE architectures
        run: |
          file build/x64/dialLog_v*.exe | tee /tmp/diallog-x64-file.txt
          grep -F "PE32+ executable (GUI) x86-64" /tmp/diallog-x64-file.txt
          file build/x86/dialLog_v*.exe | tee /tmp/diallog-x86-file.txt
          grep -F "PE32 executable (GUI) Intel 80386" /tmp/diallog-x86-file.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dialLog-x64
          path: build/x64/dialLog_v*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dialLog-x86
          path: build/x86/dialLog_v*.exe

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run regression and all mutations
        run: make check-full
